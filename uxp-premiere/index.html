<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Bridge UXP (Premiere)</title>
  <style>
    :root {
      --bg: #14161b;
      --panel: #1c1f26;
      --line: #2b303b;
      --text: #e6e8ee;
      --muted: #9aa3b2;
      --accent: #8b5cf6;
      --ok: #35d07f;
      --warn: #f2b84b;
      --err: #ff5d5d;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font: 12px/1.45 "Segoe UI", Arial, sans-serif;
      height: 100%;
    }
    .wrap { display: flex; flex-direction: column; height: 100%; padding: 10px; gap: 10px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--err); box-shadow: 0 0 0 2px rgba(255,93,93,.18); }
    .dot.online { background: var(--ok); box-shadow: 0 0 0 2px rgba(53,208,127,.18); }
    .title { font-weight: 600; letter-spacing: .3px; }
    .sub { color: var(--muted); font-size: 10.5px; }
    .status { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
    .status.online { color: var(--ok); }
    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11.5px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button:active { transform: translateY(1px); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .log {
      flex: 1;
      overflow-y: auto;
      font-family: Consolas, "Courier New", monospace;
      font-size: 10.5px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--muted);
    }
    .log .line { border-bottom: 1px dashed rgba(255,255,255,.04); padding: 2px 0; }
    .log .ok { color: var(--ok); }
    .log .warn { color: var(--warn); }
    .log .err { color: var(--err); }
    .hint { color: var(--muted); font-size: 10.5px; }
    .pill { border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; font-size: 10px; color: var(--muted); }
    .pill.online { border-color: rgba(53,208,127,.4); color: var(--ok); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <span class="dot" id="dot"></span>
        <div>
          <div class="title">Studio Bridge <span class="pill" id="transport">UXP</span></div>
          <div class="sub">Premiere Pro v25.6+ / v27.0</div>
        </div>
      </div>
      <button id="reconnect" title="Reconectar al puente local">Reconectar</button>
    </header>

    <div class="card row">
      <span class="status" id="status">DESCONECTADO</span>
      <span class="hint" id="endpoint">ws://127.0.0.1:8765</span>
    </div>

    <div class="card" style="flex:1; display:flex; flex-direction:column; min-height:120px;">
      <div class="row" style="margin-bottom:6px;">
        <span class="hint">Actividad UXP</span>
        <span class="hint" id="verbCount">0 verbos</span>
      </div>
      <div class="log" id="log"></div>
    </div>

    <div class="hint">
      Token leído de <span style="color:var(--text)">~/.antigravity-studio-bridge/.bridge-secret</span>.
      Si no conecta, abre el broker y vuelve a cargar el panel.
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
